<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" fill="none">
  <!-- Hachiware & Chiikawa Reading Together (Bottom Right) -->
  <g id="hachiware-cozy" transform="translate(15, 20)">

    <!-- Background Doodles: Sparkles, Notes, Coffee -->
    <path d="M 270 60 Q 275 66 280 66 Q 275 66 270 72 Q 270 66 265 66 Q 270 66 270 60 Z" fill="#E9C46A" opacity="0.85"/>
    <path d="M 40 40 Q 45 45 50 45 Q 45 45 40 50 Q 40 45 35 45 Q 40 45 40 40 Z" fill="#81B29A" opacity="0.7"/>
    <circle cx="285" cy="110" r="3.5" fill="#E07A5F" opacity="0.6"/>

    <!-- Small Notebook Stack on the left -->
    <g transform="translate(25, 175)">
      <!-- Bottom book -->
      <rect x="0" y="24" width="70" height="16" rx="3" fill="#DCEEFB" stroke="#3D352E" stroke-width="2.5"/>
      <line x1="8" y1="24" x2="8" y2="40" stroke="#3D5A80" stroke-width="2"/>
      <!-- Middle book -->
      <rect x="5" y="10" width="62" height="15" rx="3" fill="#FFF3B0" stroke="#3D352E" stroke-width="2.5"/>
      <line x1="12" y1="10" x2="12" y2="25" stroke="#E07A5F" stroke-width="2"/>
      <!-- Top open notebook or tea cup -->
      <rect x="10" y="-2" width="54" height="13" rx="3" fill="#D8F3DC" stroke="#3D352E" stroke-width="2.5"/>
      <!-- Tiny Coffee Cup -->
      <path d="M 72 26 C 72 20 86 20 86 26 C 86 36 72 36 72 26 Z" stroke="#3D352E" stroke-width="2" fill="none"/>
      <path d="M 72 16 L 86 16 L 84 32 C 84 35 74 35 74 32 Z" fill="#FFFFFF" stroke="#3D352E" stroke-width="2"/>
      <!-- Steam -->
      <path d="M 77 11 Q 79 7 76 3" stroke="#8E8275" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M 82 12 Q 84 8 81 4" stroke="#8E8275" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Hachiware Body (Cat ears, blue head marking) -->
    <!-- Left Pointy Ear -->
    <path d="M 125 78 L 105 38 C 100 28 116 22 124 34 L 142 66" fill="#89C2D9" stroke="#3D352E" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Right Pointy Ear -->
    <path d="M 218 66 L 236 34 C 244 22 260 28 255 38 L 235 78" fill="#89C2D9" stroke="#3D352E" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Head & Body Base -->
    <path d="M 120 85 C 95 115 95 170 120 205 C 145 230 215 230 240 205 C 265 170 265 115 240 85 C 220 62 140 62 120 85 Z" fill="#FFFDF9" stroke="#3D352E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Hachiware's Blue Marking (八字藍色劉海) -->
    <path d="M 122 80 C 130 65 155 64 165 80 C 170 88 180 94 180 94 C 180 94 190 88 195 80 C 205 64 230 65 238 80 C 248 96 250 115 248 128 C 244 122 225 106 195 106 C 180 106 180 114 180 114 C 180 114 180 106 165 106 C 135 106 116 122 112 128 C 110 115 112 96 122 80 Z" fill="#89C2D9"/>
    <!-- Re-stroke top contour of blue marking if needed -->
    <path d="M 136 106 C 155 106 166 114 180 114 C 194 114 205 106 224 106" stroke="#3D352E" stroke-width="2.5" fill="none"/>

    <!-- Tail on the right -->
    <path d="M 250 188 C 265 180 272 195 260 205" fill="#89C2D9" stroke="#3D352E" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheeks (Blushing Pink) -->
    <ellipse cx="132" cy="148" rx="11" ry="7" fill="#FFB5B5" opacity="0.85"/>
    <line x1="125" y1="148" x2="139" y2="148" stroke="#E07A5F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="127" y1="152" x2="137" y2="152" stroke="#E07A5F" stroke-width="1.5" stroke-linecap="round"/>

    <ellipse cx="228" cy="148" rx="11" ry="7" fill="#FFB5B5" opacity="0.85"/>
    <line x1="221" y1="148" x2="235" y2="148" stroke="#E07A5F" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="223" y1="152" x2="233" y2="152" stroke="#E07A5F" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eyebrows (Determined / Cute straight diagonal or arched) -->
    <path d="M 144 118 Q 150 115 156 118" stroke="#3D352E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 204 118 Q 210 115 216 118" stroke="#3D352E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Big Sparkly Eyes -->
    <ellipse cx="152" cy="132" rx="8" ry="9.5" fill="#3D352E"/>
    <circle cx="150" cy="129" r="3" fill="#FFFFFF"/>
    <circle cx="154" cy="135" r="1.3" fill="#FFFFFF"/>

    <ellipse cx="208" cy="132" rx="8" ry="9.5" fill="#3D352E"/>
    <circle cx="206" cy="129" r="3" fill="#FFFFFF"/>
    <circle cx="210" cy="135" r="1.3" fill="#FFFFFF"/>

    <!-- Cute Smiling Cat Mouth -->
    <ellipse cx="180" cy="136" rx="2" ry="1.5" fill="#3D352E"/>
    <path d="M 173 142 Q 177 146 180 143 Q 183 146 187 142" stroke="#3D352E" stroke-width="2.4" stroke-linecap="round" fill="none"/>

    <!-- Tiny Feet -->
    <path d="M 148 218 C 146 226 160 228 164 220" fill="#FFFDF9" stroke="#3D352E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 196 220 C 200 228 214 226 212 218" fill="#FFFDF9" stroke="#3D352E" stroke-width="3" stroke-linecap="round"/>

    <!-- Paws holding a Pen / Bookmark -->
    <path d="M 178 170 L 195 150" stroke="#E07A5F" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="152" cy="178" rx="8" ry="7" fill="#FFFDF9" stroke="#3D352E" stroke-width="3"/>
    <ellipse cx="208" cy="178" rx="8" ry="7" fill="#FFFDF9" stroke="#3D352E" stroke-width="3"/>
  </g>
</svg>
