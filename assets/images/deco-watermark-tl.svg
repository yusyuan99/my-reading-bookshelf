<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" fill="none">
  <!-- Top Left: Ribbon Bows & Cherries Watermark -->
  <g id="ribbons-and-cherries">
    <!-- Cherry Pair 1 (Top Left) -->
    <g transform="translate(18, 20)">
      <!-- Stems -->
      <path d="M 38 12 Q 28 26 22 42" stroke="#606C38" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 38 12 Q 44 26 50 40" stroke="#606C38" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Leaf -->
      <path d="M 38 12 Q 48 6 56 12 Q 48 18 38 12 Z" fill="#81B29A" stroke="#3D352E" stroke-width="1.8"/>
      <!-- Left Cherry -->
      <circle cx="20" cy="48" r="12" fill="#E76F51" stroke="#3D352E" stroke-width="2.2"/>
      <ellipse cx="16" cy="44" rx="3" ry="4" fill="#FFFFFF" opacity="0.7"/>
      <!-- Right Cherry -->
      <circle cx="52" cy="46" r="12" fill="#E63946" stroke="#3D352E" stroke-width="2.2"/>
      <ellipse cx="48" cy="42" rx="3" ry="4" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Pretty Ribbon Bow 1 (Center) -->
    <g transform="translate(140, 25)">
      <!-- Left Loop -->
      <path d="M 45 35 C 10 15 5 45 40 42 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 22 28 C 30 32 38 35 40 37" stroke="#E76F51" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Right Loop -->
      <path d="M 45 35 C 80 15 85 45 50 42 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 68 28 C 60 32 52 35 50 37" stroke="#E76F51" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Knot -->
      <ellipse cx="45" cy="37" rx="7" ry="6" fill="#E76F51" stroke="#3D352E" stroke-width="2.2"/>
      <!-- Left Tail -->
      <path d="M 40 42 Q 25 65 18 72 Q 28 66 38 60 Q 42 50 42 42 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2"/>
      <!-- Right Tail -->
      <path d="M 50 42 Q 65 65 72 72 Q 62 66 52 60 Q 48 50 48 42 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2"/>
    </g>

    <!-- Floating Bow 2 (Small pastel pink) -->
    <g transform="translate(25, 175) scale(0.85)">
      <path d="M 30 25 C 8 10 5 35 28 32 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="2.2"/>
      <path d="M 30 25 C 52 10 55 35 32 32 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="2.2"/>
      <ellipse cx="30" cy="27" rx="5" ry="4.5" fill="#E07A5F" stroke="#3D352E" stroke-width="2"/>
      <path d="M 27 31 Q 16 50 12 55 Q 20 49 27 45 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="1.8"/>
      <path d="M 33 31 Q 44 50 48 55 Q 40 49 33 45 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="1.8"/>
    </g>

    <!-- Little Cherry Pair 2 (Bottom right of cluster) -->
    <g transform="translate(165, 165) scale(0.85)">
      <path d="M 30 10 Q 22 22 18 34" stroke="#606C38" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 30 10 Q 35 22 40 33" stroke="#606C38" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M 30 10 Q 38 5 45 10 Q 38 15 30 10 Z" fill="#81B29A" stroke="#3D352E" stroke-width="1.8"/>
      <circle cx="16" cy="40" r="10" fill="#E63946" stroke="#3D352E" stroke-width="2"/>
      <ellipse cx="13" cy="37" rx="2.5" ry="3" fill="#FFFFFF" opacity="0.75"/>
      <circle cx="42" cy="39" r="10" fill="#E76F51" stroke="#3D352E" stroke-width="2"/>
      <ellipse cx="39" cy="36" rx="2.5" ry="3" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- Sparkles and tiny stars -->
    <path d="M 115 20 Q 118 24 122 24 Q 118 24 115 28 Q 115 24 111 24 Q 115 24 115 20 Z" fill="#E9C46A"/>
    <path d="M 235 125 Q 238 129 242 129 Q 238 129 235 133 Q 235 129 231 129 Q 235 129 235 125 Z" fill="#E9C46A"/>
    <path d="M 20 120 Q 23 124 27 124 Q 23 124 20 128 Q 20 124 16 124 Q 20 124 20 120 Z" fill="#E07A5F"/>
  </g>
</svg>
