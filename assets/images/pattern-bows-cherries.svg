<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Subtle All-over Wallpaper Pattern: Bows, Cherries & Sparkles -->
  <g id="wallpaper-pattern" opacity="0.14">

    <!-- 1. Top-Left Motif: Ribbon Bow (粉橘手帳蝴蝶結) -->
    <g transform="translate(38, 38)">
      <!-- Left loop -->
      <path d="M 24 20 C 2 7 0 28 22 24 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 12 16 C 16 19 21 21 22 22" stroke="#E76F51" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Right loop -->
      <path d="M 24 20 C 46 7 48 28 26 24 Z" fill="#F4A261" stroke="#3D352E" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 36 16 C 32 19 27 21 26 22" stroke="#E76F51" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Center knot -->
      <ellipse cx="24" cy="21" rx="4.5" ry="4" fill="#E76F51" stroke="#3D352E" stroke-width="1.8"/>
      <!-- Tails -->
      <path d="M 21 24 Q 10 40 6 45 Q 12 41 18 37 Q 22 30 22 24 Z" fill="#F4A261" stroke="#3D352E" stroke-width="1.6"/>
      <path d="M 27 24 Q 38 40 42 45 Q 36 41 30 37 Q 26 30 26 24 Z" fill="#F4A261" stroke="#3D352E" stroke-width="1.6"/>
    </g>

    <!-- 2. Top-Right Motif: Twin Cherries (雙生紅櫻桃 🍒) -->
    <g transform="translate(158, 36)">
      <!-- Stems -->
      <path d="M 24 8 Q 16 20 12 32" stroke="#606C38" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 24 8 Q 30 20 35 30" stroke="#606C38" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Leaf -->
      <path d="M 24 8 Q 33 2 38 7 Q 31 13 24 8 Z" fill="#81B29A" stroke="#3D352E" stroke-width="1.6"/>
      <!-- Left Cherry -->
      <circle cx="11" cy="36" r="9" fill="#E63946" stroke="#3D352E" stroke-width="1.8"/>
      <ellipse cx="8.5" cy="33.5" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
      <!-- Right Cherry -->
      <circle cx="37" cy="35" r="9" fill="#D90429" stroke="#3D352E" stroke-width="1.8"/>
      <ellipse cx="34.5" cy="32.5" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- 3. Bottom-Left Motif: Twin Cherries with Different Angle (左下雙子櫻桃) -->
    <g transform="translate(38, 156)">
      <!-- Stems -->
      <path d="M 20 6 Q 13 18 10 28" stroke="#606C38" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 20 6 Q 26 17 32 27" stroke="#606C38" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Leaf -->
      <path d="M 20 6 Q 12 1 7 5 Q 13 11 20 6 Z" fill="#81B29A" stroke="#3D352E" stroke-width="1.6"/>
      <!-- Left Cherry -->
      <circle cx="9" cy="33" r="8.5" fill="#D90429" stroke="#3D352E" stroke-width="1.8"/>
      <ellipse cx="7" cy="30.5" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
      <!-- Right Cherry -->
      <circle cx="33" cy="32" r="8.5" fill="#E63946" stroke="#3D352E" stroke-width="1.8"/>
      <ellipse cx="31" cy="29.5" rx="2" ry="2.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- 4. Bottom-Right Motif: Sweet Pink Bow (右下粉紅緞帶蝴蝶結) -->
    <g transform="translate(158, 158)">
      <!-- Left loop -->
      <path d="M 24 20 C 3 9 2 29 22 24 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 12 17 C 16 19 20 21 22 22" stroke="#E07A5F" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Right loop -->
      <path d="M 24 20 C 45 9 46 29 26 24 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 36 17 C 32 19 28 21 26 22" stroke="#E07A5F" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Center knot -->
      <ellipse cx="24" cy="21" rx="4.5" ry="4" fill="#E07A5F" stroke="#3D352E" stroke-width="1.8"/>
      <!-- Tails with cut -->
      <path d="M 21 24 Q 10 39 6 44 Q 12 40 18 36 Q 22 29 22 24 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="1.6"/>
      <path d="M 27 24 Q 38 39 42 44 Q 36 40 30 36 Q 26 29 26 24 Z" fill="#FDE2E4" stroke="#3D352E" stroke-width="1.6"/>
    </g>

    <!-- Gentle Sparkles & Starlets in the gaps (保持空隙與舒適感) -->
    <!-- Center sparkle -->
    <path d="M 120 114 Q 123 120 128 120 Q 123 120 120 126 Q 120 120 115 120 Q 120 120 120 114 Z" fill="#E9C46A"/>
    <!-- Top-center sparkle -->
    <path d="M 120 22 Q 122 26 126 26 Q 122 26 120 30 Q 120 26 116 26 Q 120 26 120 22 Z" fill="#E07A5F"/>
    <!-- Bottom-center sparkle -->
    <path d="M 120 210 Q 122 214 126 214 Q 122 214 120 218 Q 120 214 116 214 Q 120 214 120 210 Z" fill="#81B29A"/>
    <!-- Left-center sparkle -->
    <path d="M 22 120 Q 24 124 28 124 Q 24 124 22 128 Q 22 124 18 124 Q 22 124 22 120 Z" fill="#E9C46A"/>
    <!-- Right-center sparkle -->
    <path d="M 218 120 Q 220 124 224 124 Q 220 124 218 128 Q 218 124 214 124 Q 218 124 218 120 Z" fill="#E07A5F"/>

  </g>
</svg>
